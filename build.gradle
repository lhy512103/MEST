plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    mavenCentral()
    maven {
        name = "CreateMod Maven"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        // Hosts AE2 ("appeng"/"org.appliedenergistics"), AE2WTLib ("de.mari_023"),
        // Mekanism, PneumaticCraft and other modding artifacts.
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "FTB Mods"
        url = "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        name = "Curios Maven"
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    maven {
        name = "Kotlin for Forge"
        url = "https://thedarkcolour.github.io/KotlinForForge/"
        content {
            includeGroup "thedarkcolour"
        }
    }
    maven {
        name = "DevOS Snapshots"
        url = "https://mvn.devos.one/snapshots/"
        content {
            includeGroup "com.tterrag.registrate"
        }
    }
    maven {
        name = "SquidDev Maven"
        url = "https://maven.squiddev.cc"
        content {
            includeGroup "cc.tweaked"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

base {
    archivesName = mod_id
}

// Runtime profiles affect development launches only; compile-time integration APIs stay available.
ext.mestRuntimeProfile = providers.gradleProperty('mestRuntimeProfile').getOrElse('full')
if (!(mestRuntimeProfile in ['minimal', 'full'])) {
    throw new GradleException('mestRuntimeProfile must be minimal or full')
}
ext.mestMinimalRuntime = mestRuntimeProfile == 'minimal'
ext.mestRunJei = providers.gradleProperty('mestRunJei').map { it.toBoolean() }.getOrElse(!mestMinimalRuntime)
ext.mestRunEmi = providers.gradleProperty('mestRunEmi').map { it.toBoolean() }.getOrElse(false)
ext.mestRunMui = providers.gradleProperty('mestRunMui').map { it.toBoolean() }.getOrElse(!mestMinimalRuntime)
if (mestMinimalRuntime && mestRunMui) {
    throw new GradleException('Modern UI is not part of minimal; use -PmestRuntimeProfile=full -PmestRunMui=true')
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    localRuntime {
        // These pull broken/duplicate transitive artifacts at runtime; not needed for our mod.
        exclude group: "curse.maven", module: "ae2-jei-integration-1074338"
        exclude group: "curse.maven", module: "imblocker-483760"
        exclude group: "curse.maven", module: "just-enough-characters-250702"
    }
    clientLocalRuntime
    // Dedicated EMI-on client launch classpath. Do not inherit
    // clientLocalRuntime: that configuration excludes EMI when mestRunEmi is off.
    clientLocalRuntimeEmi
    runtimeClasspath.extendsFrom localRuntime
}

sourceSets {
    clientRuntime {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        // Never add compileClasspath here: optional compileOnly APIs are not launch mods.
        runtimeClasspath = files(output, configurations.clientRuntimeRuntimeClasspath,
                sourceSets.main.runtimeClasspath, configurations.clientLocalRuntime)
    }
    clientRuntimeEmi {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = files(output, configurations.clientRuntimeEmiRuntimeClasspath,
                sourceSets.main.runtimeClasspath, configurations.clientLocalRuntimeEmi)
    }
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers are automatically detected, but we declare it explicitly to be safe.
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Use the client runtime source set so client-only local runtime mods are present.
            sourceSet = sourceSets.clientRuntime

            // Keep client and server runtime data separate.
            gameDirectory = project.file(mestMinimalRuntime ? 'run/minimal/client' : 'run/client')

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Same as client, but always includes EMI. Distinct sourceSet so the
        // Gradle task tree can launch either classpath without -P flags.
        clientEmi {
            client()
            sourceSet = sourceSets.clientRuntimeEmi
            gameDirectory = project.file(mestMinimalRuntime ? 'run/minimal/client' : 'run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'

            // Keep client and server runtime data separate.
            gameDirectory = project.file(mestMinimalRuntime ? 'run/minimal/server' : 'run/server')

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.clientRuntime)
            sourceSet(sourceSets.clientRuntimeEmi)
        }
    }
}

// Mod dependencies are declared in a separate file for readability.
apply from: "$rootDir/dependencies.gradle"

// Declaration-only verification: no artifact resolution or game launch. Snapshot plain values
// as task inputs so execution never captures Project/Configuration/SourceSet (configuration cache).
tasks.register('checkRuntimeProfiles') {
    group = 'verification'
    description = 'Checks minimal core isolation and full/client viewer declarations for the selected profile.'
    inputs.property('profile', mestRuntimeProfile)
    inputs.property('jei', mestRunJei)
    inputs.property('emi', mestRunEmi)
    inputs.property('mui', mestRunMui)
    inputs.property('minecraftVersion', minecraft_version)
    def runtimeConfigurations = ['localRuntime', 'clientLocalRuntime', 'clientLocalRuntimeEmi',
                                 'runtimeClasspath', 'clientRuntimeRuntimeClasspath', 'clientRuntimeEmiRuntimeClasspath']
    inputs.property('declarations', (runtimeConfigurations + ['compileOnly']).collectEntries { name ->
        [(name): configurations.getByName(name).allDependencies.collect {
            "${it.group}:${it.name}".toString()
        }.unique().sort()]
    })
    inputs.property('hierarchies', runtimeConfigurations.collectEntries { name ->
        [(name): configurations.getByName(name).hierarchy.collect { it.name }.sort()]
    })
    doLast { task ->
        def values = task.inputs.properties
        def minimal = values.profile == 'minimal'
        def declared = values.declarations
        def core = ['org.appliedenergistics:appliedenergistics2', 'org.appliedenergistics:guideme',
                    'de.mari_023:ae2wtlib'] as Set
        def shared = declared.localRuntime as Set
        assert shared.containsAll(core) : 'Both profiles must declare AE2, GuideME and AE2WTLib'
        assert !shared.any { it.startsWith('mezz.jei:') || it.startsWith('dev.emi:') } : 'Viewers must be client-only'
        if (minimal) {
            assert shared == core : "Minimal shared runtime contains extras: ${shared - core}"
            assert !values.mui : 'Minimal must not enable Modern UI'
            def compileOnlyExtras = (declared.compileOnly as Set) - core
            ['runtimeClasspath', 'clientRuntimeRuntimeClasspath', 'clientRuntimeEmiRuntimeClasspath'].each { name ->
                assert (declared[name] as Set).intersect(compileOnlyExtras).empty : "Compile-only API leaked into ${name}"
            }
        } else {
            assert shared.containsAll(['curse.maven:advancedae-1084104', 'curse.maven:ex-pattern-provider-892005',
                    'curse.maven:extendedae-plus-1337639', 'com.simibubi.create:create-1.21.1',
                    'curse.maven:mekanism-268560']) : 'Full must retain optional compatibility targets'
        }

        def expectedClient = [] as Set
        if (values.jei) {
            expectedClient.add("mezz.jei:jei-${values.minecraftVersion}-neoforge".toString())
            if (!minimal) {
                expectedClient.addAll(['curse.maven:ae2-jei-integration-1074338', 'curse.maven:just-enough-characters-250702'])
            }
        }
        if (!minimal) {
            expectedClient.addAll(['curse.maven:mouse-tweaks-60089', 'curse.maven:configured-457570',
                    'curse.maven:searchables-858542', 'curse.maven:controlling-250398', 'curse.maven:imblocker-483760'])
            if (values.mui) expectedClient.add('curse.maven:modern-ui-352491')
        }
        def expectedEmiClient = expectedClient + ['dev.emi:emi-neoforge']
        if (values.emi) expectedClient.add('dev.emi:emi-neoforge')
        assert (declared.clientLocalRuntime as Set) == expectedClient : 'Client declarations do not match profile/viewer flags'
        assert (declared.clientLocalRuntimeEmi as Set) == expectedEmiClient : 'runClientEmi must add EMI, not other optional mods'
        values.hierarchies.each { name, parents ->
            assert !parents.any { it.toLowerCase().endsWith('compileonly') || it.toLowerCase().endsWith('compileclasspath') } :
                    "${name} must not inherit compile-only dependencies"
        }
        assert !values.hierarchies.runtimeClasspath.any { it.startsWith('client') } : 'Server must not inherit client dependencies'
        task.logger.lifecycle("Runtime declarations verified: ${values.profile}, JEI=${values.jei}, EMI=${values.emi}, UI=${values.mui}; game launch not tested")
    }
}

// Retain the previous task name for scripts and IDE task shortcuts.
tasks.register('checkViewerLaunchClasspaths') {
    group = 'verification'
    description = 'Alias for checkRuntimeProfiles.'
    dependsOn('checkRuntimeProfiles')
}
tasks.named('check') { dependsOn('checkRuntimeProfiles') }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

// Unit tests are isolated from mod dependencies by default. Packet codec tests need the same
// Minecraft/NeoForge/AE2 API classes that compile the main source set.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir("generated/sources/modMetadata")
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
