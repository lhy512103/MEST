name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - { name: full-jei-only, flags: "-PmestRuntimeProfile=full -PmestRunJei=true -PmestRunEmi=false" }
          - { name: full-jei-emi, flags: "-PmestRuntimeProfile=full -PmestRunJei=true -PmestRunEmi=true" }
          - { name: full-none, flags: "-PmestRuntimeProfile=full -PmestRunJei=false -PmestRunEmi=false" }
          - { name: full-emi-only, flags: "-PmestRuntimeProfile=full -PmestRunJei=false -PmestRunEmi=true" }
          # No viewer flags: also verify minimal's no-viewer default.
          - { name: minimal-none, flags: "-PmestRuntimeProfile=minimal" }
          - { name: minimal-jei-only, flags: "-PmestRuntimeProfile=minimal -PmestRunJei=true -PmestRunEmi=false" }
          - { name: minimal-emi-only, flags: "-PmestRuntimeProfile=minimal -PmestRunJei=false -PmestRunEmi=true" }
          - { name: minimal-jei-emi, flags: "-PmestRuntimeProfile=minimal -PmestRunJei=true -PmestRunEmi=true" }
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check runtime declarations (${{ matrix.runtime.name }})
        run: ./gradlew checkRuntimeProfiles ${{ matrix.runtime.flags }} --no-daemon --stacktrace

      - name: Build with selected runtime (${{ matrix.runtime.name }})
        run: ./gradlew build ${{ matrix.runtime.flags }} --no-daemon --stacktrace

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesplicedterminal-${{ github.sha }}-${{ matrix.runtime.name }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 14
