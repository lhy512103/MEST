name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        viewer:
          - { name: jei-only, flags: "-PmestRunJei=true -PmestRunEmi=false" }
          - { name: jei-emi, flags: "-PmestRunJei=true -PmestRunEmi=true" }
          - { name: none, flags: "-PmestRunJei=false -PmestRunEmi=false" }
          - { name: emi-only, flags: "-PmestRunJei=false -PmestRunEmi=true" }
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check viewer launch declarations (${{ matrix.viewer.name }})
        run: ./gradlew checkViewerLaunchClasspaths ${{ matrix.viewer.flags }} --no-daemon --stacktrace

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesplicedterminal-${{ github.sha }}-${{ matrix.viewer.name }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 14
