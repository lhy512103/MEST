# Mod metadata. Properties in ${} are expanded from gradle.properties by the
# generateModMetadata task (see build.gradle).

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="lhy"
description='''
A spliceable, drag-and-drop ME terminal that unifies AE2 wireless terminal modules into one customizable, file-manager-style workspace.
'''

[[mixins]]
    config="mest.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},21.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Applied Energistics 2 — required, this mod builds on its terminal/grid system.
[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="[19.2.17,20)"
    ordering="AFTER"
    side="BOTH"

# AE2 Wireless Terminal Library — required, provides the wireless terminal framework we integrate.
[[dependencies.${mod_id}]]
    modId="ae2wtlib"
    type="required"
    versionRange="[19.5.0,20)"
    ordering="AFTER"
    side="BOTH"

# JEI — optional recipe viewer. When present, the MEST JEI plugin registers a crafting-matrix
# transfer handler so the JEI "+" button fills the MEST crafting grid.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    ordering="AFTER"
    side="CLIENT"

# EMI — optional recipe viewer. When present, the MEST EMI plugin registers a crafting-matrix
# transfer handler (reusing AE2's EmiUseCraftingRecipeHandler) for the MEST menu type.
[[dependencies.${mod_id}]]
    modId="emi"
    type="optional"
    ordering="AFTER"
    side="CLIENT"

# ExtendedAE Plus — optional. Provider picker, pattern upload and encoding extras load only when present.
[[dependencies.${mod_id}]]
    modId="extendedae_plus"
    type="optional"
    ordering="AFTER"
    side="BOTH"

# ExtendedAE — optional. Pattern-access rows reuse its highlight and message helpers; the pin-button
# sprite is gated so MEST still renders without it.
[[dependencies.${mod_id}]]
    modId="extendedae"
    type="optional"
    ordering="AFTER"
    side="CLIENT"

# ClientSort — optional. Its inventory-sort button positions are re-projected for the floating workspace.
[[dependencies.${mod_id}]]
    modId="clientsort"
    type="optional"
    ordering="AFTER"
    side="CLIENT"

# Neo ECO AE — optional. Non-processing encode auto-upload targets ECO pattern storage.
[[dependencies.${mod_id}]]
    modId="neoecoae"
    type="optional"
    ordering="AFTER"
    side="BOTH"

# AE2 Lightning Tech — optional. Crafting-assembler group routing and duplicate filter for auto-upload.
[[dependencies.${mod_id}]]
    modId="ae2lt"
    type="optional"
    ordering="AFTER"
    side="BOTH"
