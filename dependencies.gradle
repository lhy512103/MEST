def mestRunJei = !project.hasProperty("mestRunJei") || project.property("mestRunJei").toString().toBoolean()
def mestRunEmi = !project.hasProperty("mestRunEmi") || project.property("mestRunEmi").toString().toBoolean()
// Modern UI replaces the client text/tooltip pipeline; a development switch makes it easy to
// bisect GUI rendering issues between Modern UI and vanilla rendering.
def mestRunMui = !project.hasProperty("mestRunMui") || project.property("mestRunMui").toString().toBoolean()

// localRuntime is shared by client and dedicated-server launches. Keep client-only
// recipe viewers out unconditionally, including copies pulled transitively by Create.
configurations.localRuntime.exclude group: "mezz.jei"
configurations.localRuntime.exclude group: "dev.emi"

if (!mestRunJei) {
    configurations.clientLocalRuntime.exclude group: "mezz.jei"
    configurations.clientLocalRuntime.exclude group: "curse.maven", module: "ae2-jei-integration-1074338"
}
if (!mestRunEmi) {
    configurations.clientLocalRuntime.exclude group: "dev.emi"
}

dependencies {
    // AE2 + AE2WTLib API (compile-time only)
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "de.mari_023:ae2wtlib_api:${ae2wtlib_version}"

    // AE2 addons (compile-time only, for optional integration code)
    compileOnly "curse.maven:advancedae-1084104:${advancedae_file}"
    compileOnly "curse.maven:ex-pattern-provider-892005:${extendedae_file}"
    compileOnly "curse.maven:extendedae-plus-1337639:${extendedae_plus_file}"
    compileOnly "curse.maven:ae2-jei-integration-1074338:${ae2jei_integration_file}"
    compileOnly "curse.maven:applied-flux-965012:${applied_flux_file}"
    compileOnly "curse.maven:applied-create-1474758:${applied_create_file}"
    compileOnly "curse.maven:mega-cells-622112:${mega_cells_file}"
    compileOnly "curse.maven:applied-mekanistics-574300:${applied_mekanistics_file}"

    // Cross-mod APIs used by optional compatibility code
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    compileOnly "com.simibubi.create:create-1.21.1:${create_version}"
    compileOnly "mekanism:Mekanism:${mekanism_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "curse.maven:polymorph-388800:${polymorph_file}"

    // Local runtime core mods
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    localRuntime "de.mari_023:ae2wtlib:${ae2wtlib_version}"
    localRuntime "curse.maven:spark-361579:${spark_file}"
    localRuntime "maven.modrinth:modernfix:${modernfix_version}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Local runtime AE2 addons
    localRuntime "curse.maven:advancedae-1084104:${advancedae_file}"
    localRuntime "curse.maven:ae2-crystal-science-1435174:${ae2_crystal_science_file}"
    localRuntime "curse.maven:ae2-utility-1521605:8655365"
    localRuntime "curse.maven:ex-pattern-provider-892005:${extendedae_file}"
    localRuntime "curse.maven:extendedae-plus-1337639:${extendedae_plus_file}"
    localRuntime "curse.maven:applied-energistics-2-wireless-terminals-459929:${ae2wt_terminals_file}"
    localRuntime "curse.maven:applied-flux-965012:${applied_flux_file}"
    localRuntime "curse.maven:applied-create-1474758:${applied_create_file}"
    localRuntime "curse.maven:mega-cells-622112:${mega_cells_file}"
    localRuntime "curse.maven:applied-mekanistics-574300:${applied_mekanistics_file}"
    localRuntime "curse.maven:merequester-688367:${merequester_file}"

    // Local runtime dependencies and integration targets
    localRuntime "curse.maven:glodium-957920:${glodium_file}"
    localRuntime "curse.maven:geckolib-388172:${geckolib_file}"
    localRuntime "curse.maven:cloth-config-348521:${cloth_config_file}"
    localRuntime "curse.maven:polymorph-388800:${polymorph_file}"
    localRuntime "curse.maven:brandons-core-231382:${brandons_core_file}"
    localRuntime "curse.maven:codechicken-lib-1-8-242818:${codechicken_lib_file}"
    localRuntime "curse.maven:draconic-evolution-223565:${draconic_evolution_file}"
    localRuntime "curse.maven:productivebees-377897:${productive_bees_file}"
    localRuntime "curse.maven:sophisticated-storage-619320:${sophisticated_storage_file}"
    localRuntime "curse.maven:sophisticated-core-618298:${sophisticated_core_file}"
    localRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
    localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    localRuntime "dev.ftb.mods:ftb-ultimine-neoforge:${ftb_ultimine_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
    localRuntime("com.simibubi.create:create-1.21.1:${create_version}") {
        // Needed to prevent game-test crashes pulled by Create's optional integrations.
        exclude group: "maven.modrinth", module: "journeymap"
        exclude group: "info.journeymap", module: "journeymap-api-neoforge"
    }
    localRuntime "curse.maven:mekanism-268560:${mekanism_file}"
    localRuntime "me.desht.pneumaticcraft:pneumaticcraft-repressurized:${pneumaticcraft_version}"
    localRuntime "thedarkcolour:kotlinforforge-neoforge:${kotlinforforge_version}"

    // Client-only recipe viewers and their integrations. Override with
    // -PmestRunJei=false and/or -PmestRunEmi=false to exercise all combinations.
    if (mestRunJei) {
        clientLocalRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        clientLocalRuntime "curse.maven:ae2-jei-integration-1074338:${ae2jei_integration_file}"
        // Just Enough Characters is a JEI search addon; keep it out of EMI-only
        // and viewer-disabled launch matrices.
        clientLocalRuntime "curse.maven:just-enough-characters-250702:${jech_file}"
    }
    if (mestRunEmi) {
        clientLocalRuntime "dev.emi:emi-neoforge:${emi_version}"
    }

    // Client-only local runtime UI and input helpers
    if (mestRunMui) {
        clientLocalRuntime "curse.maven:modern-ui-352491:${modern_ui_file}"
    }
    clientLocalRuntime "curse.maven:mouse-tweaks-60089:${mouse_tweaks_file}"
    clientLocalRuntime "curse.maven:configured-457570:${configured_file}"
    clientLocalRuntime "curse.maven:searchables-858542:${searchables_file}"
    clientLocalRuntime "curse.maven:controlling-250398:${controlling_file}"
    clientLocalRuntime "curse.maven:imblocker-483760:${imblocker_file}"
}

// The clientRuntime source set is launch-only and has no sources of its own. Its
// initial classpath includes main.compileClasspath, which would otherwise leak
// compileOnly optional integrations into every client run and defeat the flags
// above. Build the launch classpath only from actual runtime dependencies.
sourceSets.clientRuntime.runtimeClasspath = files(
        sourceSets.clientRuntime.output,
        configurations.clientRuntimeRuntimeClasspath,
        sourceSets.main.runtimeClasspath,
        configurations.clientLocalRuntime
)
